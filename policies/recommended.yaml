apiVersion: relaydot.dev/v1alpha1
kind: SyncPolicy
metadata:
  name: curated-subset
  annotations:
    relaydot.dev/mode: current-user-choice
    relaydot.dev/note: >-
      Current policy: synchronize only the curated configuration and history
      directories listed below. Credentials, logs, caches, todos, and other
      local state are ignored and never leave the machine. Ignore rules use
      Syncthing semantics: the first matching rule wins, so the negations above
      the trailing "*" are the complete allow list.
spec:
  enforcedApplicationSettings:
    claude:
      cleanupPeriodDays: 36500
    codex:
      history.persistence: save-all
  retention:
    revisions: forever
    tombstones: forever
    garbageCollection: disabled
  behavior:
    deletionPolicy: archive-and-restore
    deleteExcluded: false
    includeHidden: true
    preserveSymlinks: true
    followSymlinkTargets: false
    regularFilesOnly: true
    conflictStrategy: preserve_both_and_pause_path
    secretScan: report
    encryptionRequired: end-to-end
    maxFileSize: unlimited
  roots:
    - name: claude
      path: ~/.claude
      classification: curated-configuration-and-history
      syncMode: hybrid-full-mirror
      include:
        - /**
      ignore:
        # keep only the directories listed here
        - "!/settings.json"
        - "!/commands"
        - "!/skills"
        - "!/plugins"
        - "!/projects"
        # ignore everything else (credentials, logs, caches, todos, etc.)
        - "*"
    - name: codex
      path: ~/.codex
      optional: true
      classification: curated-configuration-and-history
      syncMode: hybrid-full-mirror
      include:
        - /**
      ignore:
        # Codex equivalents of settings.json, commands, and projects
        - "!/config.toml"
        - "!/prompts"
        - "!/sessions"
        - "*"
