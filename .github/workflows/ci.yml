name: CI

on:
  # No bare `push:`. With one, a branch that has an open pull request ran every
  # job twice, once per event. Branch pushes are covered by the pull request.
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  controller:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install locked workspace
        run: pnpm install --frozen-lockfile
      - name: Documentation and deployment file checks
        run: pnpm check:docs
      - name: OpenAPI contract
        run: pnpm lint:contracts
      - name: Deployment script checks
        run: pnpm check:deployment
      # The Compose file marks these required with `:?`, so an operator cannot
      # deploy without pinning the browser-facing origin. Validation therefore
      # has to supply them the same way a real deployment does.
      - name: Production Compose configuration
        env:
          RELAYDOT_ADMIN_TOKEN: ci-validation-token
          RELAYDOT_PUBLIC_URL: https://relaydot.ci.invalid
        run: docker compose -f infra/compose/compose.yaml config --quiet
      - name: Local-build Compose overlay
        env:
          RELAYDOT_ADMIN_TOKEN: ci-validation-token
          RELAYDOT_PUBLIC_URL: https://relaydot.ci.invalid
        run: docker compose -f infra/compose/compose.yaml -f infra/compose/compose.build.yaml config --quiet
      - name: Type check
        run: pnpm lint:controller
      - name: Tests and coverage
        run: pnpm test:controller
      - name: Production build
        run: pnpm build:controller

  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install Python 3.11
        run: uv python install 3.11
      - name: Sync locked environment
        working-directory: agent
        run: uv sync --all-groups --locked --python 3.11
      - name: Lint
        working-directory: agent
        run: uv run ruff check .
      - name: Format check
        working-directory: agent
        run: uv run ruff format --check .
      - name: Type check
        working-directory: agent
        run: uv run mypy src
      - name: Tests and branch coverage
        working-directory: agent
        run: uv run pytest --cov=relaydot --cov-report=term-missing
      - name: Build release distributions
        working-directory: agent
        run: uv build --no-sources
      - name: Smoke test wheel
        working-directory: agent
        run: uv run --isolated --no-project --with dist/*.whl python tests/smoke_package.py
      - name: Smoke test source distribution
        working-directory: agent
        run: uv run --isolated --no-project --with dist/*.tar.gz python tests/smoke_package.py

  # Folded in from the former standalone "Controller image" workflow, which ran
  # in parallel with the tests rather than after them: on main both started in
  # the same second, so a commit that failed CI still published `latest` to
  # GHCR. `needs` makes that impossible.
  #
  # The build runs for pull requests too, without pushing, because a broken
  # Dockerfile is otherwise only discovered once it is already on main.
  image:
    needs: [controller, agent]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        name: Normalize the GHCR image name
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/relaydot-controller" >> "$GITHUB_OUTPUT"
      - id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
      - if: github.event_name != 'pull_request'
        name: Smoke-test the published controller
        shell: bash
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
        run: |
          set -euo pipefail
          tag="sha-${GITHUB_SHA::7}"
          docker pull "${IMAGE_NAME}:${tag}"
          docker run --detach --rm \
            --name relaydot-controller-smoke \
            --publish 127.0.0.1:3000:3000 \
            --env RELAYDOT_ADMIN_TOKEN=ci-smoke-token \
            "${IMAGE_NAME}:${tag}"
          trap 'docker logs relaydot-controller-smoke; docker stop relaydot-controller-smoke' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/api/v1/health \
              | grep --quiet '"journal_mode":"wal"'; then
              exit 0
            fi
            sleep 1
          done
          exit 1
